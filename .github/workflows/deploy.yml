name: Deploy Markdown to PDF App

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build & Run with Docker Compose
        run: |
          docker compose down || true
          docker compose up -d --build --force-recreate
