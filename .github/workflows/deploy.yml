name: Deploy Markdown to PDF App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Production Docker Deployment
    runs-on: [ubuntu-latest, self-hosted, linux, host, docker]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧹 Prune Unused Docker Cache & Temp Files
        run: |
          docker system prune -f || true

      - name: 🚀 Rebuild & Deploy Container
        run: |
          docker compose down || true
          docker compose up -d --build --force-recreate

      - name: 🏥 Container Health Check
        run: |
          sleep 3
          docker ps --filter "name=md_to_pdf_app"
