version: "3.8"

services:
  md-to-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md_to_pdf_app
    ports:
      - "4231:3000"  # External Host Port 4231 -> Container Unified Port 3000
    environment:
      - NODE_ENV=production
      - PORT=4000
    restart: unless-stopped
