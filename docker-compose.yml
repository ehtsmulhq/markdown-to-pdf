version: "3.8"

services:
  md-to-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md_to_pdf_app
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    restart: unless-stopped
