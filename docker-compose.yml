version: "3.8"

services:
  md-to-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md_to_pdf_app
    ports:
      - "8089:3000"   # Frontend UI on host port 8089
      - "4000:4000"   # Backend API on host port 4000
    environment:
      - NODE_ENV=production
      - PORT=4000
    restart: unless-stopped
