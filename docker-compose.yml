version: "3.8"

services:
  md-to-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md_to_pdf_app
    ports:
      - "3000:3000"  # Single Unified Port for UI & PDF Conversion API
    environment:
      - NODE_ENV=production
      - PORT=4000
    restart: unless-stopped
