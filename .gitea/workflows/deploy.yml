name: Build & Deploy Markdown to PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: [ubuntu-latest, self-hosted, linux, host, docker]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Server and Client
        run: npm run build

  docker-build:
    needs: build-and-test
    runs-on: [ubuntu-latest, self-hosted, linux, host, docker]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Container Image
        run: docker build -t md-to-pdf:latest .
