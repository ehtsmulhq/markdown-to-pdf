name: Build & Deploy Markdown to PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [ubuntu-latest, self-hosted, linux, host, docker]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          node-version: '20'
        continue-on-error: true

      - name: Build & Run with Docker Compose
        run: |
          docker compose down || true
          docker compose up -d --build --force-recreate
